<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Id and Classes</title>
    <style>
        .group {
            margin: 20px 0;
        }

        .group {
            color: black;
        }

        .btn {
            background-color: blue;
            color: whitesmoke;
            padding: 10px 20px;
        }

        .input-field {
            width: 300px;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div class="group">
        <form action="" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" class="input-field" placeholder="Enter your name..">
    </div>
    <div class="group">
        <label for="email">Email:</label>
        <input type="email" id="email" class="input-field" placeholder="Enter your email..">
    </div>
    <div class="group">
        <label for="password">Password:</label>
        <input type="password" id="password" class="input-field" placeholder="Enter your password..">
    </div>
    <div class="group">
        <label for="some">Message</label>
        <textarea id="some" cols="40" rows="10" class="input-field" placeholder="Enter your message here.."></textarea>
    </div>
    <button id="button" class="btn">Login</button>
    </form>

</body>

</html>
