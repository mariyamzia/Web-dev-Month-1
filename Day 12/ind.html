<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build a form </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form action="" method="post">
        <header>
            <h1>Student Registration Form</h1>
        </header>
        <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter name here..." required>
        </div>
        <div>
            <label for="email">Email</label>
            <input type="text" id="email" name="eamil" placeholder="Enter email here..." required>
        </div>
        <div>
            <label for="age">Age</label>
            <input type="number" id="age" name="age" placeholder="Enter age here..." required>
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="passowrd" placeholder="Enter password here..." required>
        </div>
        <div>
            <label for="message">Message:</label>
            <br>
            <textarea name="message" id="message" cols="40" rows="10" placeholder="Leave message here..."></textarea>
        </div>
        <footer>
            <button>Login</button>
        </footer>
    </form>
</body>

</html>
