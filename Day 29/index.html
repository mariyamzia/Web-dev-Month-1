<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox</title>
    <style>
        .container {
            border: 2px solid red;
            display: flex;
            justify-content: center;
            height: 80vh;
            align-items: center;
            /* flex-direction:column; */
            /* flex-wrap: wrap; */
            /* align-content:center;
           flex-flow: row wrap; */
            /* gap: 20px; */
            /* row-gap: 60px;
           column-gap: 50px; */
            gap: 50px 10px;
        }

        .item {
            /* flex-grow: 1; */
            height: 92px;
            width: 92px;
            background-color: rgb(201, 201, 239);
            border: 2px solid black;
            margin: 4px;
        }

        .order-1 {
            order: 1;
        }

        .order-2 {
            order: 2;
        }

        .order-3 {
            order: 4;
        }
        .item-1{
            /* flex-grow: 4; */
             align-self: flex-start;
             align-self: flex-end; 
        }
    </style>
</head>

<body>
    <main>
        <div class="container">
            <div class="item item-1">Item 1</div>
            <div class="item order-2">item 2</div>
            <div class="item order-3">Item 3</div>
            <div class="item order-3">Item 4</div>
            <div class="item order-1">Item 7</div>
            <div class="item"></div>
            <div class="item"></div>

        </div>
    </main>
</body>

</html>
