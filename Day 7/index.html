<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos,image and audios</title>
</head>

<body>
    <h1>For BMW lovers...</h1>
    <video src="video1.mp4" controls width="220" height="300"></video>
    <video src="video.mp4" controls width="220" height="300"></video>
    <h1>For food lovers..</h1>
    <img src="image1.jpg" width="222" height="222" alt="This is a food image.">
    <audio src="audio.mp3" controls></audio>
    <svg width="100" height="100" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
    </svg>
    <svg width="100" height="100" viewBox="0 0 100 100">
        <!-- Draws a triangle using Path: Move to (50,10), Line to (90,90), Line to (10,90), Close path -->
        <path d="M 50 10 L 90 90 L 10 90 Z" fill="orange" />
    </svg>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/IgKWPdJWuBQ?si=NeYwdf5chnrswpYv&amp;start=6" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>

</html>
