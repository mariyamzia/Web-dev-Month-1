<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        h1 {
            text-align: center;
            color: rebeccapurple;
            font-family: monospace;
        }

        .box {
            background-color: hotpink;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            width: 200px;
            height: 200px;
            display: inline-block;
        }

        .box1 {
            background-color: salmon;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            width: 200px;
            height: 200px;
            display: inline-block;
        }

        .container {
            display: grid;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            gap: 34px;
            display: flex;

            .item {
                background-color: rgb(144, 144, 232);
                width: 400px;
                height: 50px;
                padding: 2px;
    </style>
</head>

<body>
    <h1>CSS Display Property</h1>
    <div class="box">I am div </div>
    <span class="box1">I am span </span>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Architecto iste libero corrupti ullam dolore saepe
        voluptas magnam vero! At aperiam consequatur nisi.</p>

    <section class="container">
        <div class="item">Card 1</div>
        <div class="item">Card 2</div>
        <div class="item">Card 3</div>
    </section>
</body>

</html>
