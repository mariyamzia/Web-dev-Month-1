<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display property</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        .box {
            border: 2px solid red;
            display: inline-block;
            padding: 35px;
            margin: 20px;
            width: 345px;
            display: inline-flex;
            justify-content: center;
        }

        .nom {
            display: block;
        }
    </style>
</head>

<body>
    <div class="box box1">
        I am a box
    </div>
    <div class="box">
        and a very nice box
    </div>
    <span class="nom">I am Mariyam</span>
    <span>and i am a good girl</span>
</body>

</html>
