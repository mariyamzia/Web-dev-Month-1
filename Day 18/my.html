<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap');

        .box {
            color: rgb(79, 4, 89);
            font-family: "Lato", sans-serif;
            font-weight: 700;
            font-style: normal;

        }

        .box1 {
            display: inline-block;
            width: 300px;
            height: 300px;
            box-shadow: 5px 10px 9px rgb(2, 2, 62);
            padding: 20px;
            font-family: "Lato", sans-serif;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgb(243, 49, 49), -2px -2px 5px rgb(61, 8, 217);

        }

        .box2 {
            display: inline-block;
            width: 300px;
            height: 300px;
            box-shadow: 5px 10px 9px rgb(2, 2, 62);
            padding: 20px;
            font-family: "Lato", sans-serif;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgb(243, 49, 49), -2px -2px 5px rgb(61, 8, 217);
        }
    </style>
</head>

<body>
    <h1 class="box">Box Shadows</h1>
    <span class="box1">Hey I am box1,how are you?</span>
    <span class="box2">Hey I am box2,what's going on bro?</span>
</body>

</html>
