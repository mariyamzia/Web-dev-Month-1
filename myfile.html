<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My personal form</title>
</head>

<body>
    <form action="/submit" method="post">
        <div>
            <label for="name">Full name:</label>
            <input type="text" id="name" name="fullname" placeholder="Enter your name..." required>
        </div>
        <div>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" placeholder="Enter your age here" required>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
        </div>
        <div>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="******" required>
        </div>
        <div>
            <label for="country">Country:</label>
            <select id="country" name="country">
                <option>Pakistan</option>
                <option>India</option>
                <option>China</option>
                <option>UK</option>
                <option>Japan</option>
                <option>UAE</option>
                <option>South korea</option>
                <option>Saudi Arabia</option>
                <option>Iran</option>
                <option>Switzerland</option>
                <option>Russia</option>
                <option>Australia</option>
            </select>
        </div>
        <div>
            <label for="message">Enter your message here:</label>
            <textarea id="message" name="message" rows="10" cols="40" placeholder="Write your message here..."
                required></textarea>
        </div>
        <button type="submit">Submit</button>
    </form>
</body>

</html>
