<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Lists</title>
    <style>
        h1 {
            color: darkslategray;
            padding: 20px;
            text-align: center;
        }

        /* Style the actual text links */
        nav ul li a {
            text-decoration: none;
            /* Removes the default underline */
            color: #333;
            /* Changes text to a clean dark grey */
            font-family: sans-serif;
            /* Smooths out the font style */
            font-weight: bold;
            transition: color 0.2s;
            /* Makes the hover transition smooth */
        }

        /* Change color when mouse hovers over a link */
        nav ul li a:hover {
            color: #4CAF50;
            /* Turns green on hover */
        }
        ul{
            display: flex;
            padding: 23px;
            list-style-type:none;
        }
        nav ul li{
            margin-left: 20px;
        }
    </style>
</head>

<body>
    <h1>Styling lists using CSS</h1>
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

</body>

</html>
