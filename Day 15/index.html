<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Spacificity</title>
    <style>
        /* universal selector */
        *{
            color: yellow;
        }
        /* element selector */
        h1{
            color: blue;
        }
        /* class selector */
        .h1{
            color: green;
        }
        /* ID selector */
        #title{
            color: pink;
        }
    </style>
</head>
<body>
    <h1 class="h1">CodewithMariyam/ </h1>
    <h1 style="color: tomato;">CodewithMe</h1>
</body>
</html>
