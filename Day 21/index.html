<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Property</title>
    <style>
        h1{
            color: blue;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            text-align: center;
            ;
            text-decoration: underline;
        }
        *{
            padding: 0;
            margin: 0;
        }
        .box{
            border: 2px solid black;
            height: 100px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
            filter: invert();
        }
        .box1{
            background-color: aqua;
            /* position: relative;
            z-index: 12; */
            /* position: absolute;
            top: 8px;
            left: 23px; */
            /* position: sticky;
            top: 10px;
            height: 100px; */
            
        }
        .box2{
            background-color: azure;
            /* position: relative;
            top: 48px;
            left: 56px; */
        }
        .box3{
            background-color: gainsboro;
            /* position: fixed;
            bottom: 0px;
            left: 8vw;
            height: 111px; */
        }
        .box4{
            background-color: bisque;
        }
        .parrent{
            padding: 34px;
            margin: 30px;
            border: 3px solid rgb(109, 2, 2);
            position: absolute;
        }
    </style>
</head>
<body>
    <h1>CSS Position Property</h1>
    <div class="parrent">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    </div>
</body>
</html>
