<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>
    <h1> Student Registration Form: </h1>
    <form action="" method="post">
        <div>
            <label for="name">Full Name:</label>
            <input type="name" id="name" name="fullname" placeholder="Enter full name here..." required>
        </div>
        <div>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" placeholder="Enter age here..." required>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter email here..." required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter password here..." required>
        </div>
        <div>
            <label for="message">Message:</label>
            <textarea id="message" name="message" cols="30" rows="10" placeholder="Enter your message here..."
                required></textarea>
        </div>
    </form>

</body>

</html>
