<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            min-height: 100vh;
            justify-content: center;
            padding: 2%;
            align-items: center;
            display: flex;
        }
        .container{
            display: grid;
            grid-template-columns: 200px 200px 200px 200px;
            grid-template-rows: 200px 200px;
            gap: 1em;
            grid-template-areas: 
                "box-1 box-2 box-2 box-3"
                "box-1 box-4 box-4 box-5";
        }
        .box{
            background-color: #6168ef;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" style="grid-area: box-1"></div>
        <div class="box" style="grid-area: box-2"></div>
        <div class="box" style="grid-area: box-3"></div>
        <div class="box" style="grid-area: box-4"></div>
        <div class="box" style="grid-area: box-5"></div>
    </div>
</body>
</html>
