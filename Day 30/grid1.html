<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 200px 200px 200px 200px;
            grid-template-rows: 200px 200px;
            gap: 10px;
            grid-template-areas: 
            "box1 box2 box2 box3"
            "";
        }
        .box-1{
            grid-area: box1;

        }
        .box-2{
            grid-area: box2;
        }
        .box-3{
            grid-area: box3;
        }
        .box-4{
            grid-area: box4;
        }
        .box-5{
            grid-area: box5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box-1">1</div>
        <div class="box-2">2</div>
        <div class="box-3">3</div>
        <div class="box-4">4</div>
        <div class="box-5">5</div>
    </div>
</body>
</html>
