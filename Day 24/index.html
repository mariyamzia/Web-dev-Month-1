<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Query</title>
    <style>
        h1 {
            color: slateblue;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            text-align: center;
            text-decoration: underline;
        }

        body {
            background-color: aqua;
        }

        .box1 {
            width: 250px;
            height: 350px;
            background-color: red;
            padding: 3px;
            margin: 3px;
        }

        .box2 {
            width: 250px;
            height: 350px;
            background-color: rgb(39, 3, 3);
            padding: 3px;
            margin: 3px;
        }

        .box3 {
            width: 250px;
            height: 350px;
            background-color: rgb(227, 204, 204);
            padding: 3px;
            margin: 3px;
        }

        .boxes {
            display: flex;
            padding: 3px;
            margin: 3px;
        }

        @media only screen and (max-width: 519px) {
            .boxes {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <h1>CSS Media Query</h1>
    <div class="boxes">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
    </div>
</body>

</html>
